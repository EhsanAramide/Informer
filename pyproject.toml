[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "informer"
version = "0.0.0"
description = "Reference-faithful, installable Informer models"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Haoyi Zhou and Informer contributors"},
]
dependencies = [
  "numpy>=2,<3",
  "torch>=2,<3",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
time = ["pandas>=2,<4"]
test = ["pytest>=8", "build>=1", "installer>=0.7"]

[project.urls]
Repository = "https://github.com/EhsanAramide/Informer"
Paper = "https://arxiv.org/abs/2012.07436"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["informer*"]
